name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npx tsc --noEmit
      - name: Test network analysis
        run: npm run test:network
      - name: Test association analysis
        run: npm run test:association
      - name: Test map interactions
        run: npm run test:map
      - name: Validate released data
        run: python scripts/validate_release.py
      - name: Audit colour palette
        run: python scripts/audit_palette.py
      - name: Build Sites worker
        run: npm run build
      - name: Smoke-test Sites worker
        run: npm run test:worker
      - name: Build static site
        run: npm run build:pages
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Stress-test production atlas
        run: npm run test:browser
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
